name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the run in progress. A run on main is never
  # stopped once started; one still waiting gives way to a newer push, so the newest
  # commit on main is always the one published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Outside node_modules, so `npm ci` keeps it and the cache below can restore it.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm ci
      - run: npm run test:e2e

  stack:
    name: Docker stack, browser tests and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The README's quick start. On a fresh checkout it writes a random JWT secret
      # to .env, so the run needs no repository secret.
      - name: Build and start MongoDB, the API and the web app
        run: npm run stack:up
      - name: Smoke test through nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet '<div id="root">'
      # Not cached: Playwright's docs note that restoring the browser takes about
      # as long as downloading it, and its system libraries need installing anyway.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser tests (Playwright and axe)
        run: npm run test:browser
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      # Fails on a HIGH or CRITICAL vulnerability that has a fix, in the Alpine or npm
      # packages of either image. The scanner image is pinned by digest.
      - name: Scan the images (Trivy)
        run: |
          for image in nest-react-auth-api nest-react-auth-web; do
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      # The publish job pushes these exact images rather than building new ones.
      - name: Save the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output images.tar nest-react-auth-api nest-react-auth-web
      - name: Upload the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar
          retention-days: 1
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish the tested images
    # Only for main, and only when every check above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, api-e2e, stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load the images
        run: docker load --input images.tar
      - name: Push to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # Registries need lower-case names.
          base="ghcr.io/${REPOSITORY,,}"
          for app in api web; do
            for tag in latest "sha-${SHA::7}"; do
              docker tag "nest-react-auth-$app" "$base-$app:$tag"
              docker push "$base-$app:$tag"
            done
          done
          docker logout ghcr.io
