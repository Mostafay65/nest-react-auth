# Serves the built web app and proxies /api to the API on the same origin, so the
# refresh cookie is first-party and no CORS is needed.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's internal DNS. With the upstream in a variable, nginx looks the API up
  # again as records expire, so it follows the API to a recreated container.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # The Host the browser sent, port included, so the API's check that Origin
    # matches Host holds for writes that carry Origin but no Sec-Fetch-Site.
    proxy_set_header Host $http_host;
    # The API trusts one proxy hop (TRUST_PROXY=1), so rate limits see the real client IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File names under /assets carry a content hash, so they can be cached for good.
  # The header is left off errors (no `always`), so a missing file is never cached.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Every other path is a client-side route. index.html is revalidated on each
  # load, so a new deploy is picked up at once.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
